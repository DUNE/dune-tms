# Specify TMS reconstruction values
# Read in by the general sim manager (TMS_Sim_Manager) for persistency

# Sim parameter constants
[Sim]
  [Sim.Readout]
    #  |----  readout time -----|------- deadtime ----{zombie time}]
    # All hits within this interval are combined into one
    ReadoutTime = 120.0 # ns
    # How long a channel is dead before it can read again
    Deadtime = -1.0 # ns, < 0 to turn off
    # Hits that happen in deadtime's zombie time get read as a new hit at the start of the next readout interval
    ZombieTime = -1.0 # ns, < 0 to turn off
    ReadoutNoise = 0.4 # in PE
    PedestalSubtractionThreshold = 3.0 # In PE
    
  [Sim.Optical]
    ShouldSimulatePoisson = true
    # Order of the photon-statistics draw in SimulateOpticalModel(). false (current default):
    # Poisson-draw the produced PE, split it between the short and long fiber paths, then
    # scale each path by attenuation/reflection/coupling (fractional PE). true: apply all of
    # those efficiencies to the expected PE first and Poisson-draw each path from its own
    # expected mean (integer PE, photon-counting variance). Same mean either way.
    PoissonAfterAttenuation = false
    BirksConstant =  0.0905 # mm / MeV
    
    ShouldSimulateFiberLengths = true
    WSFAttenuationLength = 4.160 # m
    WSFLengthMultiplier = 1.8 # Light doesn't travel straight through the fiber
    WSFEndReflectionEff = 0.0 
    AdditionalFiberLength = -1.0 # m
    AdditionalFiberAttenuationLength = 4.160 # m
    AdditionalFiberCouplingEff = 1.0
    
    ReadoutCouplingEff = 1.0
    LightYield = 50.0 # PE per MeV
    
  [Sim.Noise]
    DarkNoiseRate = 2550.0 # hz
    DarkNoiseMinPE = 3.5 # pe

  [Sim.Timing]
    # Constants of SimulateTimingModel()
    ScintillatorDecayTime = 3.0 # ns
    WLSDecayTime = 20.0 # ns
    FiberRefractiveIndex = 1.5
    ElectronicTimeNoise = 1.0 # ns, Gaussian sigma added to each hit time
    MaxTimingPhotons = 300 # per path; photons drawn for the first-arrival time (default pipeline only)

  [Sim.DetSim]
    # Gate for the detector-response redesign, built out behind this flag phase by phase.
    # Currently: merge same-bar Geant4 fragments before the optical/timing draws, then
    # stitch each hit's Geant4 steps into passages, re-slice them into fixed-length optical
    # deposits, and simulate light per deposit (local Birks, attenuation from the deposit's
    # own position, Poisson draw per deposit and path after attenuation, explicit photon
    # arrival times). Default false = existing behavior.
    UseResponseElements = false
    # Length of the optical deposits a passage is re-sliced into
    DepositBinLength = 1.0 # mm
    # Consecutive steps of one trajectory in one bar further apart than this start a new passage
    PassageMaxGap = 0.5 # mm
    # A5202 timing-mode front end (needs UseResponseElements = true): per channel, the photons'
    # fast-shaper pulses are summed and a discriminator gives the hit time (threshold crossing)
    # and time over threshold, both in TDC steps; replaces the readout-window model.
    FrontEndTimingMode = false

  [Sim.FrontEnd]
    # Citiroc-1A fast shaper: 15 ns peaking time, not programmable (CAEN Citiroc-1A datasheet).
    FastShaperPeakingTime = 15.0 # ns
    # ASSUMPTION (no source): pulse shape (t/tp)^n exp(n(1 - t/tp)), unit height per photoelectron
    # at t = tp. The order n sets the tail length and hence the time over threshold.
    FastShaperOrder = 1
    # Discriminator threshold in photoelectrons of pulse height. The chip allows down to 1/3 pe;
    # 3.0 keeps the default pipeline's 3 PE pedestal threshold for comparison (TMS setting TBD).
    DiscriminatorThreshold = 3.0 # pe
    TDCStep = 0.5 # ns, time stamp and ToT granularity (A5202)
    TimingJitter = 0.1 # ns, Gaussian (Citiroc-1A: < 100 ps RMS)
    # Hamamatsu S13360-2050VE (DUNE ND PDR Table 1.16)
    SiPMCrosstalkProbability = 0.03
    SiPMPixels = 1584
    # Estimate the hit energy from its ToT (inverting the mean waveform: fast-shaper pulse smeared
    # by the scintillator and WLS decay times) instead of from the detected photon count, as real
    # timing-mode data would have to
    EnergyFromToT = false
    
    
    
    
    

