# Specify TMS reconstruction values
# Read in by the general manager (TMS_Manager) for persistency

# Recon parameter constants
[Recon]
  # Minimum number of hits to consider reconstructing the event
  MinHits = 5

  # Track reco; Hough, AStar, DBSCAN
  TrackMethod = "Hough"
  #TrackMethod = "AStar"
  #TrackMethod = "DBSCAN"

  # Run clustering algorithm (DBSCAN) after track finding?
  Clustering = true
  #Clustering = false

  [Recon.DBSCAN]
    # The minimum points for the DBSCAN clustering algorithm
    MinPoints = 2
    # How far away can a bar/plane combination be to include in a cluster
    Epsilon = 4.5
    # Amount of neighbouring hits a hit needs to have for pre-clustering (DBSCAN)
    PreDBNeighbours = 9
    # Maximal distance to hits to count as neighbours for pre-clustering (DBSCAN)
    PreDBDistance = 4.5

  [Recon.Hough]
    # The highest number of Hough transforms we can run after each other
    MaxTrans = 10
    # Intercepts
    MinInter = -50.0E3
    MaxInter = 50.0E3
    # Slopes
    MinSlope = -1.5
    MaxSlope = 1.5
    # Number of Hough bins, resolution should be about 1cm
    #NSlope = 10000
    #NInter = 10000
    NSlope = 1000
    NInter = 2000
    # Minimum distance for Hough
    # What factor of hits of total do we need to cover to count a successful Hough line finding
    HitMult = 0.2
    # Minimum distance for a Hough track (prevents overfinding) -- in bars and plane
    # dist = sqrt(xplanes*xplanes + zplanes*zplanes)
    MinDist = 8.0
    # Do we run DBSCAN clustering before the Hough transform and then run Hough on each cluster?
    FirstCluster = false  #true
    # Do we merge adjacent tracks afterwards?
    MergeTracks = true
    # Do we run AStar afterwards on start and end points
    # To undo the greediness in the Hough line finding?
    RunAStarCleanup = true
    # Half-width of the Hough line-containment window, in transverse bar widths.
    # The prior three-point test had an effective half-width of 1.5.  A value
    # of 6.0 is the nominal 4x retuning after the X-bar transverse-width fix.
    # This is deliberately shared by X and Y; change it only for a global
    # reconstruction study, not as a view-specific geometry correction.
    ContainmentHalfWidth = 6.0

  [Recon.Extrapolation]
    # Whether extrapolation should be performed or not
    Extrapolation = true
    # Maximal distance from start/end hit to first added hit by extrapolation
    ExtrapolateDist = 8
    # Maximal distance from first added hit (by extrapolation) to last added hit
    ExtrapolateLimit = 40
    # Distance in number of bars a hit can be away from the direction line at the end
    NumBarsEnd = 4
    # Distance in number of bars a hit can be away from the direction line at the start
    NumBarsStart = 2
    # Shared multiplier on the transverse-width extrapolation windows.  1.0
    # reproduces the original code; 4.0 is the nominal retuning after the
    # X-bar transverse-width fix.  It applies to both X and Y.
    ContainmentWidthMultiplier = 4.0
    # Extra allowance for X-bar candidate distances during extrapolation's
    # heuristic-distance stage.  This is independent of the transverse-width
    # containment multiplier above.
    XBarDistanceMultiplier = 2.0

  [Recon.TrackMatch3D]
    # How many plane layers can the ends/starts of the two simple tracks be away from each other?
    PlaneLimit = 8
    # How many bars can the ends/starts of the two simple tracks be away from each other?
    BarLimit = 12
    # How many ns can the ends/starts of the two simple tracks be away from each other?
    # 30 (was 16): in the X/Y geometry the two views of one muon are read out at different ends of their bars
    # (y-measuring bars at the sides, x-measuring bars at the top), so light travel puts their times up to
    # 20-40 ns apart near the detector corners; 16 ns rejects those pairs. 2026-10-05, 24 files: legacy found
    # 74.5 -> 82.8% of ND-LAr muons, good reconstruction 53.0 -> 59.7%, duplicate tracks not worse.
    TimeLimit = 30
    # How many ns can the ends/starts of a X simple track be away from U simple track?
    XTimeLimit = 40 #15 # (~10 ns time difference for 3.1m long bars both, plus a bit extra)
    # What is the 'anchor point' of the scintillator bars in y [mm]?
    YAnchor = -910.0
    # Tilt angle of scintillator planes for calculation of y (tan(90-angle))
    TiltAngle = 19.0811366877 #tan(90-3=87)
    # Y difference for expectation of reconstruction from UV and from X hit [mm]
    YDifference = 3000.0
    # Distance from start to calculate track direction for [Number of planes]. Track matching done in plane pairs -> do not set to 1
    DirectionDistance = 28

  [Recon.TrackSmoothing]
    UseTrackSmoothing = true
    TrackSmoothingStrategy = "simple"
    # This is the max y distance a track can travel in a UV detector
    # before we expect to see another transition point
    # Used to calculate the maximum slope you can hide in the UV Y position uncertainty
    MaxYDistanceBetweenUVTransitionPoints = 300.0 # mm
    # For a UV detector, this is the uncertainty in X
    # Numbers from TMS det review 2024-10-18
    UncertaintyGoodDirection = 18.0 # mm
    # For a UV detector, this is the default uncertainty in Y
    UncertaintyBadDirection = 340.0 # mm
    # In UV detector, transition point has better uncertainty
    # This is found using the FWHM of reco - true for transition points only
    UncertaintyForUVTransitionPoints = 120.0 # mm

  [Recon.AStar]
    #CostMetric = "Manhattan"
    CostMetric = "Euclidean"
    #CostMetric = "DetectorZ"
    #CostMetric = "DetectorNotZ"
    IsGreedy = false
    # Maximum plane gap allowed in local hit-merging logic
    MergePlaneGap = 6
    # Maximum bar gap allowed in local hit-merging logic
    MergeBarGap = 4

  [Recon.Kalman]
    Run = true # Whether we run the Kalman filter or not
    Assumed_Charge = 0.5 # Assumed to be a muon , 0.1 is for the assumption of being a muon. -0.1 is for the assumption of being an anti-muon. 0.0 is for no magnetic field.

  [Recon.Stopping]
    nLastHits = 5 # The number of hits at the end of track to look at for stopping
    EnergyCut = 2.5 # The cut in MeV to see if a track has come to a stop or not
    
  [Recon.Time]
    RunTimeSlicer = true # Whether to run a time slicer
    TimeSlicerThresholdStart = 10.0 # The minimum window energy to start a slice
    TimeSlicerThresholdEnd = 5.0 # The window energy to end a slice
    SliceUnit = 1.0 # ns, the algorithm splits an array into TimeSlicerMaxTime/SliceUnit chunks. Each array represents 1 SliceUnit of time
    TimeSlicerEnergyWindowInUnits = 10 # units, so 10*1ns unit = 10ns window
    TimeSlicerMinimumSliceWidthInUnits = 19 # units, the minimum width of a slice in time
    TimeSlicerMaxTime = 10000.0 # ns, how far in time to search for slices
    RunSimpleTimeSlicer = false # Whether to run a simple time slicer which splits slices into X slices
    # Per-view slicing: run the slicer on each view's hits separately, then link
    # each x-view slice to one y-view slice and vice versa; linked groups become
    # the slices. Candidates must overlap in time within PerViewMatchToleranceNs
    # and in z within PerViewMatchZMarginMM.
    # Motivation (2026-09-27): light travel along the bars puts a muon's two views
    # up to 20-40 ns apart, so a slice boundary can fall between them; a muon split
    # by view gets no space points and is usually lost.
    # PerViewThresholdScale multiplies the start/end energy thresholds for each
    # view; a value <= 0 (a float -- toml11 rejects a bare 0 here) scales them
    # instead by that view's share of the spill's energy (recommended; a fixed 0.5
    # under-triggers the y view, which has ~37% of the energy).
    # PerViewMatching picks each view slice's partner:
    #   "Coincidence" (recommended): the candidate with the most planes holding
    #     x/y hit pairs (within PerViewCoincidenceDzMM in z) whose times agree
    #     within PerViewCoincidenceWindowNs after correcting each hit for light
    #     travel along its bar (PerViewFiberDelayNsPerMM, using the partner hit's
    #     coordinate) and for flight time; at least PerViewMinCoincidencePlanes.
    #     The fiber delay matches the simulation's (1.8 x path at c/1.5); real
    #     data would need it calibrated.
    #   "BestOverlap": the candidate overlapping most in time.
    #   "MutualOverlap": as BestOverlap, but only mutual best pairs (worse).
    # Files 1-15 vs. the standard slicer: Coincidence gives 120 vs. 110 slices per
    # spill, muons with views in different slices 1.2 vs. 5.3%, Cluster3D found
    # 91.1 -> 93.5%, legacy unchanged; BestOverlap: 83 slices, legacy -1.6 pp.
    # On by default (requested at the 2026-10-01 TMS studies meeting); false
    # restores the original single slicer, whose output is unchanged.
    PerViewSlicing = true
    PerViewThresholdScale = 0.0
    PerViewMatchToleranceNs = 40.0
    PerViewMatchZMarginMM = 200.0
    PerViewMatching = "Coincidence"
    PerViewMinCoincidencePlanes = 3
    PerViewCoincidenceWindowNs = 10.0
    PerViewCoincidenceDzMM = 200.0
    PerViewFiberDelayNsPerMM = 0.009
    # Slicing algorithm per view (studies, 2026-09-30): "Window" (the original
    # forward 10-unit window: open at TimeSlicerThresholdStart, close below
    # ...End, keep a W-1 unit tail and skip it untested); "WindowNoSkip" (the
    # same, but every unit is tested, so a slice can open inside the previous
    # one's tail); "Gap" (no window: a new slice wherever consecutive hits are
    # more than PerViewGapNs apart, groups longer than PerViewGapMaxDurationNs
    # split at their largest internal gap, groups below the start threshold
    # dropped). PerViewSliceCountHits: thresholds count hits instead of MeV
    # (PerViewHitCountThresholdStart/End, scaled per view like the MeV ones).
    PerViewSliceAlgorithm = "Window"
    PerViewSliceCountHits = false
    PerViewHitCountThresholdStart = 3.0
    PerViewHitCountThresholdEnd = 1.5
    PerViewGapNs = 10.0
    PerViewGapMaxDurationNs = 100.0
    # Orphan pickup (off at 0): a hit in no slice joins a slice ending or starting
    # within PerViewOrphanPickupNs of it that already has a hit near it in space
    # (same view: within PerViewOrphanPickupDzMM in z and PerViewOrphanPickupDNotZMM
    # along the measured coordinate; other view: within PerViewOrphanPickupDzMM in z).
    PerViewOrphanPickupNs = 0.0
    PerViewOrphanPickupDzMM = 200.0
    PerViewOrphanPickupDNotZMM = 150.0

  [Recon.SpacePoints]
    # Timing window for pairing X and Y hits (in nanoseconds)
    # Based on DUNE RF bucket spacing (19 ns) + transit time margin
    TimingWindow = 30.0 # ns
    # Which planes' hits are paired into space points (TMS_PlanePairing):
    #  "NearestY"       -- each x-measuring plane with its nearest y-measuring plane
    #                      (front-section ties -> downstream), point z = midpoint of
    #                      the two planes; one point layer per x-measuring plane.
    #  "BothNeighbors" -- the original scheme: each y-measuring plane with the
    #                      x-measuring planes on both sides, point z = the
    #                      y-measuring plane's z. Kept only until NearestY is
    #                      validated (2026-09-25 plan), then to be removed.
    Pairing = "NearestY"
    # NearestY only: a hit left with no partner in its own plane pair may pair
    # across its other adjacent x/y gap instead (recovers crossings where the
    # partner plane's hit is missing).
    PairingFallback = true
    # Pair two hits only if one particle could have crossed both bars: an X-bar
    # (measuring y) is split at x = 0 into two bars read out at opposite sides,
    # so a hit in one half cannot belong with a Y-bar hit far on the other side.
    # Files 1-15 (2026-10-01): removes 9.7% of space points, 97% of them ghosts;
    # muon tracks mixing two particles' x and y hits 3.0 -> 1.6%, duplicate
    # muon tracks -34%, efficiency unchanged. false: pair them anyway.
    PairingRequireCrossing = true
    # With PairingRequireCrossing: the largest sideways slope (dx/dz) allowed
    # between the two hits' planes (they are 65-130 mm apart in z).
    PairingCrossingSlope = 1.0
  [Recon.Cluster3D]
    # Run the Cluster3D reconstruction (space points -> DBSCAN -> Kalman
    # follower, TMS_Cluster3DReco) on every slice and write its tracks, in the
    # legacy track format, to the Reco_Tree_C3D / Truth_Info_C3D trees next
    # to the legacy Reco_Tree / Truth_Info. On by default so it runs side by side
    # with the legacy reconstruction (validated on 248 production files,
    # 2026-10-06); false skips it and the C3D trees.
    Enabled = true
    # Stage 2: graph search inside clusters that are not track-like. Off: as
    # first designed it adds few muons and many non-muon tracks (2026-09-25).
    GraphSearch = false
    # Link DBSCAN clusters that are pieces of one track (ordered in z, colinear,
    # same time) and fit each chain as one object (TMS_ClusterLinker). 15 files,
    # 2026-09-26: suite ND-physics muons ending correctly 405 -> 443 of 616,
    # duplicate tracks halved, +5% non-muon tracks. On, as validated.
    LinkClusters = true
    # Cluster3D track momentum from range (the momentum needed to cross exactly
    # the material between its first and last hit and stop), as the legacy
    # fit's Momentum is defined -- for tracks that stop inside the TMS; tracks
    # that leave keep the curvature fit's (range is only a lower bound there).
    # "Stops inside": the fitted end at least RangeContainmentMarginXY (mm)
    # from the x/y faces of the bar region and RangeContainmentMarginZ (mm)
    # before its back face. 15 files, 2026-09-27: 98% of stopping muons keep
    # range (+0.7% median), 81% of leaving muons switch to curvature (median
    # -56% -> -16%). On, as validated; off: always the curvature fit's.
    MomentumFromRange = true
    RangeContainmentMarginXY = 100.0
    RangeContainmentMarginZ = 100.0
    # Re-walk each Cluster3D track seeded with this factor x its own range
    # momentum, keeping the new fit if it reaches further (0 = off). 15 files,
    # 2026-09-27: tracks ending correctly 459 -> 476 of 616, early ends inside
    # the track's own object 19 -> 7, no more junk.
    RangeReseedFactor = 1.5
    # Follower candidate choice by each space point's transit-corrected X/Y hit
    # time difference (TMS_SpacePointTiming): each candidate's score gains
    # (dt / XYTimeSigmaNs)^2, and candidates with |dt| > XYTimeGateNSigma x
    # XYTimeSigmaNs are rejected (0 = rank only). Without the gate, 6% of muon
    # tracks paired the muon's hits in one view with another particle's in the
    # other ("view mismatch"): once on that branch, position outweighs the time
    # penalty. 15 files, 2026-09-28, gate 2 (7.4 ns): mismatched muon tracks
    # 6.0 -> 2.6%, ND muons ending correctly 522 -> 529 of 566, junk tracks
    # -24%, duplicates -38%, muons found unchanged; tighter gates lose muons.
    XYTimeSigmaNs = 3.7
    XYTimeGateNSigma = 2.0
  [Recon.Calibration]
    EnergyCalibration = 0.08856 # MeV / PE
    
# Variables that have to do with the geometry or location of the detector
[Geometry]
  # Option to load geometry from a separate GDML file instead of the input data file
  # Set to true to use GDMLFilePath below; false (default) loads from input file
  UseGDMLFile = false
  # Path to GDML file (only used if UseGDMLFile = true)
  # Can also be overridden via CLI: --gdml-file /path/to/file.gdml
  GDMLFilePath = ""

  YBarMiddle = -1.35  #m
  GitTag = "v2025.08.11"
  GitBranch = "HEAD"
  GitCommit = "cc28d73d93ee4c50c9f5b453c996e4ea20373e2f"
  NumberOfScintillatorPlanes = 82
  NumberOfSteelPlatesThin = 34
  NumberOfSteelPlatesThick = 22
  NumberOfSteelPlatesDouble = 24

  # Volume-name substrings used to identify detector components while walking
  # the geometry tree read from the input GDML (see TMS_Geom / TMS_Bar / TMS_Event).
  # Update these -- not a compiled constant -- if a future GDML renames volumes.
  [Geometry.VolumeNames]
    ModuleLayer = "modulelayervol"
    ModuleLayerU = "modulelayervol1" # +3 degree tilt from pure y orientation
    ModuleLayerV = "modulelayervol2" # -3 degree tilt from pure y orientation
    ModuleLayerX = "modulelayervol3" # 90 degree rotated/tilted from vertical
    ModuleLayerY = "modulelayervol4" # pure y orientation
    Module = "ModuleBoxvol"
    ScintLayer = "scinBoxlvTMS"
    ScintLayerOrtho = "scinBoxlv_orthoTMS"
    ScintLayerParallel = "scinBoxlv_parallelTMS"
    TopLayer = "volWorld"
    DetEnclosure = "volDetEnclosure"
    TMSVolume = "TMS"
    TMSEDepSimVolume = "volTMS"
    LArActive = "TPCActive"
  [Fiducial.TMS.Start]
    X = -3419.0 # mm  # TODO this is very preliminary
    Y = -2976.23 # mm # TODO this is very preliminary
    Z = 11134.0 # mm
  [Fiducial.TMS.End]
    X = 3419.0 # mm   # TODO this is very preliminary
    Y = 291.77 # mm   # TODO this is very preliminary
    Z = 18535.0 # mm
  [Active.LAr.Start]
    X = -3478.48 # mm
    Y = -2166.71 # mm
    Z = 4179.24 # mm
  [Active.LAr.End]
    X = 3478.48 # mm
    Y = 829.282 # mm
    Z = 9135.88 # mm
  [Fiducial.LAr]
    DownstreamZCut = 1500.0 #mm
    XYCut = 500.0 # mm
    OuterShellThickness=300.0 # mm
    CutEnergy = 30.0 # MeV

# Options for processing and saving truth information
# LightWeight reduces run time signficantly because we only care about TMS objects (no LAr)
[Truth]
  LightWeight = false
  LArFiducialCut = 200.0 # mm

# Draw PDF of "event display". Slows down reco considerably
[Applications]
  DrawPDF = false
  MaximumNEvents = -1

[Meta]
  [Meta.Version]
    Major = 1
    Minor = 1
    Patch = 0
